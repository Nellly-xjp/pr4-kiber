<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Головна</title>
</head>
<body>
  <h1>Головна сторінка (/home)</h1>
  <p>Вітаємо, <b id="username">...</b>! Ваша роль: <b id="role">...</b></p>
  
  <nav>
    <a href="/profile">Мій Профіль</a> | 
    <a href="/admin">Адмін Панель</a> | 
    <button onclick="logout()">Вийти</button>
  </nav>

  <script>
    fetch('/api/me')
      .then(res => res.ok ? res.json() : window.location.href = '/')
      .then(data => {
        document.getElementById('username').innerText = data.user.username;
        document.getElementById('role').innerText = data.user.role;
      });

    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/';
    }
  </script>
</body>
</html>
