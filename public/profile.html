<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Профіль</title>
</head>
<body>
  <h1>Профіль користувача </h1>
  <p>Користувач: <b id="username">...</b></p>
  <p>Роль: <b id="role">...</b></p>
  <p>Час останнього успішного входу: <b id="lastLogin">...</b></p>

  <nav>
    <a href="/home">На головну</a> | 
    <button onclick="logout()">Вийти</button>
  </nav>

  <script>
    fetch('/api/me')
      .then(res => res.ok ? res.json() : window.location.href = '/')
      .then(data => {
        document.getElementById('username').innerText = data.user.username;
        document.getElementById('role').innerText = data.user.role;
        document.getElementById('lastLogin').innerText = data.user.lastLogin || 'Перший вхід';
      });

    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/';
    }
  </script>
</body>
</html>
